<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Ribbit: Celebrating State (Jumping in Joy, Arms Up, Confetti Explosion) -->
  <defs>
    <linearGradient id="bodyGradCelebrate" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="40%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
    <linearGradient id="bellyGradCelebrate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <filter id="softShadowCelebrate" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#1A2332" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Distant Ground Shadow (Airborne) -->
  <ellipse cx="100" cy="186" rx="34" ry="7" fill="#1A2332" fill-opacity="0.14" />

  <!-- Confetti Celebration Burst (Golden, Coral, Sky Blue, Lime) -->
  <!-- Golden Stars & Rectangles -->
  <path d="M 28 45 L 30 50 L 35 51 L 31 54 L 32 59 L 28 56 L 24 59 L 25 54 L 21 51 L 26 50 Z" fill="#FFD54F" />
  <path d="M 170 42 L 172 47 L 177 48 L 173 51 L 174 56 L 170 53 L 166 56 L 167 51 L 163 48 L 168 47 Z" fill="#FFD54F" />
  <rect x="22" y="80" width="7" height="4" rx="1.5" transform="rotate(25 22 80)" fill="#FFD54F" />
  <rect x="175" y="75" width="8" height="4" rx="1.5" transform="rotate(-35 175 75)" fill="#FFD54F" />

  <!-- Sky Blue Spirals & Ribbons -->
  <path d="M 38 105 Q 46 115 36 122" stroke="#42A5F5" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <rect x="162" y="112" width="9" height="4" rx="1.5" transform="rotate(40 162 112)" fill="#42A5F5" />
  <circle cx="48" cy="32" r="3" fill="#42A5F5" />
  <circle cx="152" cy="28" r="3.5" fill="#42A5F5" />

  <!-- Coral Alert Streamers -->
  <rect x="36" y="60" width="8" height="4" rx="1.5" transform="rotate(-20 36 60)" fill="#FF7043" />
  <rect x="156" y="62" width="7" height="4" rx="1.5" transform="rotate(15 156 62)" fill="#FF7043" />
  <circle cx="26" cy="120" r="2.5" fill="#FF7043" />
  <circle cx="172" cy="130" r="3" fill="#FF7043" />

  <!-- Upward Motion Lines beneath frog -->
  <path d="M 72 165 L 72 173" stroke="#81C784" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 100 168 L 100 178" stroke="#81C784" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 128 165 L 128 173" stroke="#81C784" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Airborne Jumping Ribbit Body Group -->
  <g transform="translate(0, -12)" filter="url(#softShadowCelebrate)">
    <!-- Left Arm Raised High (\o) -->
    <path d="M 56 104 C 42 85 30 65 36 48" stroke="#388E3C" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 56 104 C 42 85 30 65 36 48" stroke="#4CAF50" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <!-- Left Hand Open Joyful Toes -->
    <circle cx="36" cy="46" r="5" fill="#66BB6A" />
    <circle cx="30" cy="42" r="4" fill="#66BB6A" />
    <circle cx="42" cy="42" r="4" fill="#66BB6A" />

    <!-- Right Arm Raised High (o/) -->
    <path d="M 144 104 C 158 85 170 65 164 48" stroke="#388E3C" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 144 104 C 158 85 170 65 164 48" stroke="#4CAF50" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <!-- Right Hand Open Joyful Toes -->
    <circle cx="164" cy="46" r="5" fill="#66BB6A" />
    <circle cx="158" cy="42" r="4" fill="#66BB6A" />
    <circle cx="170" cy="42" r="4" fill="#66BB6A" />

    <!-- Jumping Feet Bent Playfully Upward -->
    <ellipse cx="64" cy="156" rx="14" ry="10" transform="rotate(-20 64 156)" fill="#388E3C" />
    <ellipse cx="136" cy="156" rx="14" ry="10" transform="rotate(20 136 156)" fill="#388E3C" />
    <!-- Left Toes -->
    <circle cx="54" cy="162" r="4.5" fill="#4CAF50" />
    <circle cx="63" cy="165" r="4.8" fill="#4CAF50" />
    <circle cx="73" cy="164" r="4.5" fill="#4CAF50" />
    <!-- Right Toes -->
    <circle cx="127" cy="164" r="4.5" fill="#4CAF50" />
    <circle cx="137" cy="165" r="4.8" fill="#4CAF50" />
    <circle cx="146" cy="162" r="4.5" fill="#4CAF50" />

    <!-- Main Round Chubby Body -->
    <path d="M 52 110 C 44 80 64 56 100 56 C 136 56 156 80 148 110 C 145 138 132 158 100 158 C 68 158 55 138 52 110 Z" fill="url(#bodyGradCelebrate)" />

    <!-- Eye Sockets -->
    <circle cx="68" cy="54" r="24" fill="url(#bodyGradCelebrate)" />
    <circle cx="132" cy="54" r="24" fill="url(#bodyGradCelebrate)" />

    <!-- Joyful Curved Eyes (Smiling Arcs ⌒ ⌒) -->
    <circle cx="68" cy="54" r="18" fill="#FFFFFF" />
    <circle cx="132" cy="54" r="18" fill="#FFFFFF" />
    <path d="M 57 55 C 60 44 76 44 79 55" stroke="#1A2332" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 121 55 C 124 44 140 44 143 55" stroke="#1A2332" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Light Joyful Belly -->
    <path d="M 72 112 C 72 92 84 82 100 82 C 116 82 128 92 128 112 C 128 134 116 148 100 148 C 84 148 72 134 72 112 Z" fill="url(#bellyGradCelebrate)" />

    <!-- Glowing Cheeks -->
    <ellipse cx="54" cy="100" rx="9.5" ry="6" fill="#FF8A80" fill-opacity="0.6" />
    <ellipse cx="146" cy="100" rx="9.5" ry="6" fill="#FF8A80" fill-opacity="0.6" />

    <!-- Nostrils -->
    <circle cx="95" cy="85" r="1.5" fill="#2E7D32" />
    <circle cx="105" cy="85" r="1.5" fill="#2E7D32" />

    <!-- Huge Laughing Mouth (\o/) -->
    <path d="M 80 96 C 80 96 85 124 100 124 C 115 124 120 96 120 96 Z" fill="#B71C1C" />
    <!-- Big Happy Tongue -->
    <path d="M 88 110 C 92 104 108 104 112 110 C 108 122 92 122 88 110 Z" fill="#FF8A80" />
    <!-- Top Lip Arch with Dimples -->
    <path d="M 77 96 Q 100 102 123 96" stroke="#1A2332" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 76 94 Q 75 97 78 98" stroke="#1A2332" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 124 94 Q 125 97 122 98" stroke="#1A2332" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>