<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Ribbit: Sleeping State (Closed Eyes ⌒ ⌒, Peaceful Slumber, Floating Zzz, DND Mode) -->
  <defs>
    <linearGradient id="bodyGradSleep" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="40%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
    <linearGradient id="bellyGradSleep" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <filter id="softShadowSleep" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1A2332" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Cozy Ground Shadow -->
  <ellipse cx="100" cy="180" rx="52" ry="11" fill="#1A2332" fill-opacity="0.2" />

  <!-- Floating Zzz (Golden XP & Sky Blue) -->
  <!-- Small z -->
  <g transform="translate(136, 48)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#42A5F5" opacity="0.85">z</text>
  </g>
  <!-- Medium Z -->
  <g transform="translate(150, 32)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFD54F" opacity="0.9">z</text>
  </g>
  <!-- Big Z -->
  <g transform="translate(164, 16)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFD54F">Z</text>
  </g>
  <!-- Tiny Dream Sparkles -->
  <circle cx="145" cy="54" r="1.5" fill="#42A5F5" opacity="0.6" />
  <circle cx="178" cy="30" r="2" fill="#FFD54F" opacity="0.7" />

  <!-- Main Sleeping Body Group -->
  <g filter="url(#softShadowSleep)">
    <!-- Folded Sleeping Feet -->
    <ellipse cx="68" cy="174" rx="18" ry="9" fill="#388E3C" />
    <ellipse cx="132" cy="174" rx="18" ry="9" fill="#388E3C" />
    <circle cx="56" cy="175" r="5" fill="#4CAF50" />
    <circle cx="66" cy="177" r="5.5" fill="#4CAF50" />
    <circle cx="76" cy="176" r="5" fill="#4CAF50" />
    <circle cx="124" cy="176" r="5" fill="#4CAF50" />
    <circle cx="134" cy="177" r="5.5" fill="#4CAF50" />
    <circle cx="144" cy="175" r="5" fill="#4CAF50" />

    <!-- Relaxed Chubby Body -->
    <path d="M 52 120 C 44 88 64 66 100 66 C 136 66 156 88 148 120 C 145 148 132 170 100 170 C 68 170 55 148 52 120 Z" fill="url(#bodyGradSleep)" />

    <!-- Eye Sockets -->
    <circle cx="68" cy="64" r="24" fill="url(#bodyGradSleep)" />
    <circle cx="132" cy="64" r="24" fill="url(#bodyGradSleep)" />

    <!-- Light Belly -->
    <path d="M 72 122 C 72 100 84 90 100 90 C 116 90 128 100 128 122 C 128 146 116 160 100 160 C 84 160 72 146 72 122 Z" fill="url(#bellyGradSleep)" />

    <!-- Little Hands folded peacefully across tummy -->
    <path d="M 64 130 C 74 138 84 140 92 136" stroke="#388E3C" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 136 130 C 126 138 116 140 108 136" stroke="#388E3C" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="92" cy="136" r="4" fill="#66BB6A" />
    <circle cx="108" cy="136" r="4" fill="#66BB6A" />

    <!-- Eye Whites -->
    <circle cx="68" cy="64" r="18" fill="#FFFFFF" />
    <circle cx="132" cy="64" r="18" fill="#FFFFFF" />

    <!-- Peaceful Closed Eyes (Sleepy Curved Arcs ⌒ ⌒) -->
    <path d="M 56 64 C 60 54 76 54 80 64" stroke="#1A2332" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 120 64 C 124 54 140 54 144 64" stroke="#1A2332" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Cute Eyelashes -->
    <path d="M 55 65 L 51 68" stroke="#1A2332" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 81 65 L 85 68" stroke="#1A2332" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 119 65 L 115 68" stroke="#1A2332" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 145 65 L 149 68" stroke="#1A2332" stroke-width="2.5" stroke-linecap="round" />

    <!-- Dreamy Pink Cheeks -->
    <ellipse cx="56" cy="112" rx="9" ry="6" fill="#FF8A80" fill-opacity="0.5" />
    <ellipse cx="144" cy="112" rx="9" ry="6" fill="#FF8A80" fill-opacity="0.5" />

    <!-- Nostrils -->
    <circle cx="95" cy="96" r="1.5" fill="#2E7D32" />
    <circle cx="105" cy="96" r="1.5" fill="#2E7D32" />

    <!-- Sweet Peaceful Smile -->
    <path d="M 92 112 Q 100 118 108 112" stroke="#1A2332" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Tiny Snooze Bubble near Mouth -->
    <circle cx="118" cy="108" r="6" fill="#E1F5FE" stroke="#81D4FA" stroke-width="1.2" opacity="0.8" />
    <circle cx="116" cy="106" r="1.5" fill="#FFFFFF" />
  </g>
</svg>